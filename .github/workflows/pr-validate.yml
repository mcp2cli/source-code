name: PR validate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# A reusable workflow cannot be granted more than its caller has, and the
# called job declares exactly these two: it reads the PR title and reports the
# result as a commit status. Without `statuses: write` the run is rejected at
# startup ("requesting 'statuses: write', but is only allowed 'statuses: none'")
# — silently, since an invalid workflow produces no check on the PR.
permissions:
  pull-requests: read
  statuses: write

jobs:
  pr-title:
    name: Conventional commit title
    uses: tsok-org/.github/.github/workflows/pr-validate.yml@v1
    with:
      validate_title: true
      require_scope: false
      wip_allowed: true
      header_max_length: 100
      auto_label: false
